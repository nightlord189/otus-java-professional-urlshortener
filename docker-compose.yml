services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/urlshortener
      DB_USERNAME: urlshortener
      DB_PASSWORD: urlshortener
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-before-deploying-0123456789abcdef}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
      APP_IP_SALT: ${APP_IP_SALT:-change-me-too}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
